import java.util.regex.Pattern

def renameConfig = [
        templateName             : "template",
        templateAppId            : "template.app.id",
        templateMaterialThemeName: "TemplateTheme",

        newTemplateName          : "Project",
        newTemplateAppId         : "domain.yourname.app",
        newMaterialThemeName     : "MyMaterialTheme",

        useHiltDependencies      : true,
        useRoomDependencies      : true,
        useRetrofitDependencies  : true,
        usePaparazziDependencies : true,
]

def modules = rootProject.subprojects.collect { it.name }

/**
 * --------------------------------------------
 * UTILITIES
 * --------------------------------------------
 */

static def replaceTextInFile(fileName, originalText, newText) {
    def file = new File(fileName)
    if (file.exists()) {
        file.text = file.text.replaceAll(Pattern.quote(originalText), newText)
    }
}

static def replaceRegexInFile(fileName, regex, newText) {
    def file = new File(fileName)
    if (file.exists()) {
        file.text = file.text.replaceAll(regex, newText)
    }
}

static def removeLinesContaining(fileName, text) {
    def file = new File(fileName)
    if (!file.exists()) return

    def lines = file.readLines()
    file.text = ""
    lines.each { line ->
        if (!line.contains(text)) {
            file.append(line + "\n")
        }
    }
}

static def movePackageDirectory(projectRoot, module, sourceSet, templateName, newAppId) {
    def newDirPath = newAppId.replace(".", "/")

    def javaDir = "${projectRoot}/${module}/src/${sourceSet}/java/${templateName}"
    def kotlinDir = "${projectRoot}/${module}/src/${sourceSet}/kotlin/${templateName}"

    [javaDir, kotlinDir].each { dir ->
        def fileDir = new File(dir)
        if (fileDir.exists()) {
            def parentPath = dir.substring(0, dir.indexOf(templateName))
            def targetDir = "${parentPath}${newDirPath}"

            project.copy {
                from(dir)
                into(targetDir)
                include("**/*.kt", "**/*.java")

                filter { line ->
                    line
                            .replaceAll("package ${templateName}", "package ${newAppId}")
                            .replaceAll("import ${templateName}", "import ${newAppId}")
                            .replaceAll(renameConfig.templateMaterialThemeName, renameConfig.newMaterialThemeName)
                }
            }

            fileDir.deleteDir()
        }
    }
}

/**
 * --------------------------------------------
 * PACKAGE RENAME TASK
 * --------------------------------------------
 */

tasks.register("renamePackages") {
    group = "Template Setup"

    doLast {

        def templateName = renameConfig.templateName
        def newAppId = renameConfig.newTemplateAppId
        def newThemeName = renameConfig.newMaterialThemeName

        modules.each { module ->

            ["main", "androidTest", "test"].each { sourceSet ->

                def newDirPath = newAppId.replace(".", "/")

                def javaDir = file("${rootDir}/${module}/src/${sourceSet}/java/${templateName}")
                def kotlinDir = file("${rootDir}/${module}/src/${sourceSet}/kotlin/${templateName}")

                [javaDir, kotlinDir].each { dir ->

                    if (dir.exists()) {

                        def parentPath = dir.parentFile.absolutePath
                        def targetDir = file("${parentPath}/${newDirPath}")

                        copy {
                            from(dir)
                            into(targetDir)

                            include("**/*.kt", "**/*.java")

                            filter { line ->
                                line
                                        .replace("package ${templateName}", "package ${newAppId}")
                                        .replace("import ${templateName}", "import ${newAppId}")
                                        .replace(templateName + "Theme", newThemeName)
                            }
                        }

                        delete(dir)
                    }
                }
            }
        }

        println("✅ Package rename completed")
    }
}

/**
 * --------------------------------------------
 * REPLACE REFERENCES TASK
 * --------------------------------------------
 */

tasks.register("replaceTemplateReferences") {
    group = "Template Setup"

    doLast {
        modules.each { module ->
            def moduleBuildFile = "${rootDir}/${module}/build.gradle.kts"

            // Namespace replacement (template + template.*)
            replaceRegexInFile(
                    moduleBuildFile,
                    "namespace\\s*=\\s*\"${renameConfig.templateName}(\\.[^\"]*)?\"",
                    "namespace = \"${renameConfig.newTemplateAppId}\$1\""
            )

            // Application ID
            replaceTextInFile(
                    moduleBuildFile,
                    "applicationId = \"${renameConfig.templateAppId}\"",
                    "applicationId = \"${renameConfig.newTemplateAppId}\""
            )

            // BuildConfig field rename
            replaceTextInFile(
                    moduleBuildFile,
                    "Template_HOST",
                    "${renameConfig.newTemplateName.toUpperCase()}_HOST"
            )

            // AndroidManifest Activity reference
            replaceRegexInFile(
                    "${rootDir}/${module}/src/main/AndroidManifest.xml",
                    "${renameConfig.templateName}\\.MainActivity",
                    "${renameConfig.newTemplateAppId}.MainActivity"
            )

            // App name string
            replaceRegexInFile(
                    "${rootDir}/${module}/src/main/res/values/strings.xml",
                    "<string name=\"app_name\">${renameConfig.templateName}</string>",
                    "<string name=\"app_name\">${renameConfig.newTemplateName}</string>"
            )
        }

        // Root project name
        replaceTextInFile(
                "${rootDir}/settings.gradle.kts",
                "rootProject.name = \"${renameConfig.templateName}\"",
                "rootProject.name = \"${renameConfig.newTemplateName}\""
        )
    }
}

/**
 * --------------------------------------------
 * REMOVE DEPENDENCIES IF DISABLED
 * --------------------------------------------
 */

tasks.register("keepOrRemoveDependencies") {
    group = "Template Setup"

    doLast {
        modules.each { module ->
            def files = [
                    "${rootDir}/build.gradle.kts",
                    "${rootDir}/${module}/build.gradle.kts",
                    "${rootDir}/gradle/libs.versions.toml"
            ]

            files.each { file ->
                if (!renameConfig.useHiltDependencies) {
                    removeLinesContaining(file, "hilt")
                }
                if (!renameConfig.useRoomDependencies) {
                    removeLinesContaining(file, "room")
                }
                if (!renameConfig.useRetrofitDependencies) {
                    removeLinesContaining(file, "retrofit")
                    removeLinesContaining(file, "moshi")
                }
                if (!renameConfig.usePaparazziDependencies) {
                    removeLinesContaining(file, "paparazzi")
                }
            }
        }
    }
}

/**
 * --------------------------------------------
 * DELETE SETUP LOGIC
 * --------------------------------------------
 */

tasks.register("deleteSetupCode") {
    group = "Template Setup"

    doLast {
        removeLinesContaining("${rootDir}/build.gradle.kts", "setup.gradle")
        removeLinesContaining("${rootDir}/build.gradle.kts", "buildscripts/setup.gradle")

        delete("${rootDir}/buildscripts/setup.gradle")
        delete("${rootDir}/renovate.json")
        delete("${rootDir}/.github/workflows/template_change_test.yml")
        delete("${rootDir}/.github/workflows/install_git_hooks_macos.yml")
        delete("${rootDir}/.github/workflows/install_git_hooks_windows.yml")
    }
}

/**
 * --------------------------------------------
 * MAIN EXECUTION TASK
 * --------------------------------------------
 */

tasks.register("renameTemplate") {
    group = "Template Setup"

    dependsOn(
            "renamePackages",
            "replaceTemplateReferences",
            "keepOrRemoveDependencies",
            "deleteSetupCode"
    )

    doLast {
        exec {
            commandLine "git", "add", "${rootDir}/."
        }
        println("✅ Template successfully converted to ${renameConfig.newTemplateAppId}")
    }
}
import java.util.regex.Pattern

def renameConfig = [
        templateName             : "template",
        templateAppId            : "template.app.id",
        templateMaterialThemeName: "TemplateTheme",

        newTemplateName          : "Project",
        newTemplateAppId         : "domain.yourname.app",
        newMaterialThemeName     : "MyMaterialTheme",

        useHiltDependencies      : true,
        useRoomDependencies      : true,
        useRetrofitDependencies  : true,
        usePaparazziDependencies : true,
]

/**
 * --------------------------------------------
 * AUTO FIX: PROJECT PATH CHANGE CLEAN
 * --------------------------------------------
 */

def projectRootMarker = file("${rootDir}/.projectRootPath")

tasks.register("checkProjectPathChange") {
    group = "Template Setup"

    doLast {

        def currentPath = rootDir.absolutePath

        if (projectRootMarker.exists()) {

            def oldPath = projectRootMarker.text.trim()

            if (oldPath != currentPath) {

                println "⚠️ Project folder moved!"
                println "🧹 Performing deep clean..."

                exec {
                    commandLine "./gradlew", "--stop"
                }

                delete("${rootDir}/.gradle")
                delete("${rootDir}/build")

                rootProject.subprojects.each { sub ->
                    delete("${sub.projectDir}/build")
                }

                println "✅ Deep clean completed"
            }
        }

        projectRootMarker.text = currentPath
    }
}

/**
 * --------------------------------------------
 * UTILITIES
 * --------------------------------------------
 */

static def replaceTextInFile(fileName, originalText, newText) {
    def file = new File(fileName)
    if (file.exists()) {
        file.text = file.text.replaceAll(Pattern.quote(originalText), newText)
    }
}

static def removeTextFromFile(fileName, text) {
    def file = new File(fileName)
    if (!file.exists()) return

    def lines = file.readLines()
    file.text = ""
    lines.each { line ->
        if (!line.contains(text)) {
            file.append(line + "\n")
        }
    }
}

def modules = project.subprojects.collect { it.name }

/**
 * --------------------------------------------
 * RENAME PACKAGE (ALL SOURCESETS)
 * --------------------------------------------
 */

modules.each { module ->

    tasks.register("renameAppPackage${module}") {

        doLast {

            def templateName = renameConfig.templateName
            def newAppId = renameConfig.newTemplateAppId
            def newDir = newAppId.replace(".", "/")

            ["main", "androidTest", "test"].each { sourceSet ->

                ["java", "kotlin"].each { lang ->

                    def oldDir = file("${rootDir}/${module}/src/${sourceSet}/${lang}/${templateName}")

                    if (oldDir.exists()) {

                        println("📦 Renaming ${module} ${sourceSet}/${lang}")

                        def newDirFile = file("${rootDir}/${module}/src/${sourceSet}/${lang}/${newDir}")

                        copy {
                            from(oldDir)
                            into(newDirFile)
                            include("**/*.kt", "**/*.java")

                            filter { line ->
                                line
                                        .replace("package ${templateName}", "package ${newAppId}")
                                        .replace("import ${templateName}", "import ${newAppId}")
                                        .replace(renameConfig.templateMaterialThemeName, renameConfig.newMaterialThemeName)
                            }
                        }

                        // DELETE OLD DIRECTORY COMPLETELY
                        oldDir.deleteDir()
                        println("🗑 Deleted old directory: ${oldDir}")
                    }
                }
            }
        }
    }
}

/**
 * --------------------------------------------
 * REPLACE REFERENCES
 * --------------------------------------------
 */

tasks.register('replaceTemplateReferences') {
    group "Template Setup"

    doLast {

        modules.each { module ->

            // --- FIX MANIFEST ---
            replaceTextInFile(
                    "${rootDir}/${module}/src/main/AndroidManifest.xml",
                    "${renameConfig.templateName}.MainActivity",
                    "${renameConfig.newTemplateAppId}.MainActivity"
            )

            // --- FIX MODULE build.gradle.kts (REGEX SAFE) ---
            def moduleGradle = new File("${rootDir}/${module}/build.gradle.kts")
            if (moduleGradle.exists()) {

                def text = moduleGradle.text

                // namespace = "template"
                text = text.replaceAll(
                        /namespace\s*=\s*"${renameConfig.templateName}"/,
                        "namespace = \"${renameConfig.newTemplateAppId}\""
                )

                // namespace = "template.${project.name}"
                text = text.replaceAll(
                        /namespace\s*=\s*"${renameConfig.templateName}\.\$\{project\.name\}"/,
                        "namespace = \"${renameConfig.newTemplateAppId}.\${project.name}\""
                )

                // applicationId
                text = text.replaceAll(
                        /applicationId\s*=\s*"${renameConfig.templateAppId}"/,
                        "applicationId = \"${renameConfig.newTemplateAppId}\""
                )

                moduleGradle.text = text
            }

            // --- FIX STRINGS ---
            replaceTextInFile(
                    "${rootDir}/${module}/src/main/res/values/strings.xml",
                    "<string name=\"app_name\">${renameConfig.templateName}</string>",
                    "<string name=\"app_name\">${renameConfig.newTemplateName}</string>"
            )

            // --- FIX PROTO FILES ---
            def protoDir = file("${rootDir}/${module}/src/main/proto")

            if (protoDir.exists()) {
                protoDir.eachFileRecurse { file ->
                    if (file.name.endsWith(".proto")) {

                        def protoText = file.text

                        protoText = protoText.replaceAll(
                                /option\s+java_package\s*=\s*"[^"]+"/,
                                'option java_package = "' + renameConfig.newTemplateAppId + '.datastore"'
                        )

                        file.text = protoText

                        println("🔁 Updated java_package in ${file.name}")
                    }
                }
            }
        }

        // --- FIX ROOT build.gradle.kts ---
        def rootGradle = new File("${rootDir}/build.gradle.kts")
        if (rootGradle.exists()) {

            def rootText = rootGradle.text

            // 🔥 PASTE HERE
            rootText = rootText.replaceAll(
                    /namespace\s*=\s*"${renameConfig.templateName}\.[^"]+"/,
                    "namespace = \"${renameConfig.newTemplateAppId}.\\\${project.name}\""
            )

            rootText = rootText.replaceAll(
                    /namespace\s*=\s*"${renameConfig.templateName}"/,
                    "namespace = \"${renameConfig.newTemplateAppId}\""
            )

            rootGradle.text = rootText
        }

        // --- FIX PROJECT NAME ---
        replaceTextInFile(
                "${rootDir}/settings.gradle.kts",
                "rootProject.name = \"${renameConfig.templateName}\"",
                "rootProject.name = \"${renameConfig.newTemplateName}\""
        )
    }
}

/**
 * --------------------------------------------
 * KEEP / REMOVE DEPENDENCIES
 * --------------------------------------------
 */

tasks.register('keepOrRemoveDependencies') {
    group "Template Setup"

    doLast {

        modules.each { module ->

            def files = [
                    "${rootDir}/build.gradle.kts",
                    "${rootDir}/${module}/build.gradle.kts",
                    "${rootDir}/gradle/libs.versions.toml"
            ]

            files.each { fileName ->

                if (!renameConfig.useHiltDependencies) {
                    removeTextFromFile(fileName, "hilt")
                }

                if (!renameConfig.useRoomDependencies) {
                    removeTextFromFile(fileName, "room")
                }

                if (!renameConfig.useRetrofitDependencies) {
                    removeTextFromFile(fileName, "retrofit")
                    removeTextFromFile(fileName, "moshi")
                }

                if (!renameConfig.usePaparazziDependencies) {
                    removeTextFromFile(fileName, "paparazzi")
                }
            }
        }
    }
}

/**
 * --------------------------------------------
 * FORCE CLEAN
 * --------------------------------------------
 */

tasks.register("forceFullClean") {
    group = "Template Setup"

    doLast {

        println("🧹 Cleaning all build artifacts...")

        delete("${rootDir}/.gradle")
        delete("${rootDir}/build")

        rootProject.subprojects.each { sub ->
            delete("${sub.projectDir}/build")
        }

        println("✅ Full clean completed")
    }
}

/**
 * --------------------------------------------
 * DELETE SETUP SCRIPT
 * --------------------------------------------
 */

tasks.register('deleteSetupCode') {

    doLast {

        removeTextFromFile("${rootDir}/build.gradle.kts", "setup.gradle")

        delete("${rootDir}/buildscripts/setup.gradle")
        delete("${rootDir}/renovate.json")
        delete("${rootDir}/.github/workflows/template_change_test.yml")
        delete("${rootDir}/.github/workflows/install_git_hooks_macos.yml")
        delete("${rootDir}/.github/workflows/install_git_hooks_windows.yml")
    }
}

/**
 * --------------------------------------------
 * MAIN EXECUTION
 * --------------------------------------------
 */

tasks.register('renameTemplate') {
    group "Template Setup"

    dependsOn(
            checkProjectPathChange,
            modules.collect { tasks.named("renameAppPackage${it}") },
            keepOrRemoveDependencies,
            replaceTemplateReferences,
            forceFullClean,
            deleteSetupCode
    )

    doLast {

        println("🧹 Running spotlessApply...")

        exec {
            commandLine "./gradlew", "spotlessApply"
        }
        println("✅ Template successfully converted to ${renameConfig.newTemplateAppId}")
        println("🚀 Close Android Studio, reopen project, then run: ./gradlew clean build")
    }
}